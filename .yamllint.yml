extends: default

rules:
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  comments-indentation: disable
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  line-length:
    max: 140
    level: warning
  quoted-strings: disable
  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: false
  trailing-spaces:
    level: error
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

ignore: |
  .git/
