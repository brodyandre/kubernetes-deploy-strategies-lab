# Demonstrates parallel batch processing with multiple completions and controlled concurrency.
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-processing-job
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: batch-processing-job
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: job
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  completions: 6
  parallelism: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-processing-job
        app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
        app.kubernetes.io/component: job
        environment: lab
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Iniciando processamento batch em $(hostname)"
              sleep 2
              echo "Preparando lote para execucao"
              sleep 2
              echo "Processando particao de dados"
              sleep 4
              echo "Lote concluido com sucesso em $(date)"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
