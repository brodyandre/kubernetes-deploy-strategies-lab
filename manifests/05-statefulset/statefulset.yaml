# StatefulSet with stable identity, ordered rollout, and one persistent volume per replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: web-stateful
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: statefulset
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  serviceName: web-stateful
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web-stateful
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-stateful
        app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
        app.kubernetes.io/component: statefulset
        environment: lab
    spec:
      initContainers:
        - name: bootstrap-content
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              cat <<EOF > /data/index.html
              <html>
                <body>
                  <h1>Kubernetes Deploy Strategies Lab</h1>
                  <p>StatefulSet Pod: $(hostname)</p>
                  <p>Persistent volume mounted successfully.</p>
                </body>
              </html>
              EOF
          volumeMounts:
            - name: web-content
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: web-content
        labels:
          app.kubernetes.io/name: web-stateful
          app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
          app.kubernetes.io/component: pvc
          environment: lab
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
