# StatefulSet used to demonstrate PVC retention across Pod recreation, scale down, and deletion.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: retention-demo
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: retention-demo
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: statefulset
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  serviceName: retention-demo
  replicas: 2
  # When supported by the cluster version, this policy controls what happens to PVCs
  # when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: retention-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retention-demo
        app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
        app.kubernetes.io/component: statefulset
        environment: lab
    spec:
      initContainers:
        - name: bootstrap-content
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /data/index.html ]; then
                printf '%s\n' \
                  '<html>' \
                  '  <body>' \
                  '    <h1>Volume Retention Demo</h1>' \
                  "    <p>Initial Pod Identity: $(hostname)</p>" \
                  '    <p>This file should remain on the PVC while it is retained.</p>' \
                  '  </body>' \
                  '</html>' > /data/index.html
              fi
              printf 'Pod started at %s on %s\n' "$(date)" "$(hostname)" >> /data/startup.log
          volumeMounts:
            - name: retention-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: retention-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: retention-data
        labels:
          app.kubernetes.io/name: retention-demo
          app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
          app.kubernetes.io/component: pvc
          environment: lab
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
