# Schedules recurring backup Jobs to demonstrate timed execution in Kubernetes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-backup-cronjob
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: scheduled-backup-cronjob
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scheduled-backup-cronjob
            app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
            app.kubernetes.io/component: cronjob
            environment: lab
        spec:
          restartPolicy: Never
          containers:
            - name: backup-runner
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "Horario de inicio do backup: $(date)"
                  sleep 2
                  echo "Simulacao de backup em execucao"
                  sleep 2
                  echo "Validacao do backup concluida"
                  sleep 2
                  echo "Backup finalizado com sucesso"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
