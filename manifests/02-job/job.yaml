# Runs a one-time batch task that finishes after successful processing.
apiVersion: batch/v1
kind: Job
metadata:
  name: data-processing-job
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: data-processing-job
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: job
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-processing-job
        app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
        app.kubernetes.io/component: job
        environment: lab
    spec:
      restartPolicy: Never
      containers:
        - name: processor
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Iniciando processamento de dados"
              sleep 2
              echo "Validando arquivos"
              sleep 2
              echo "Processando lote"
              sleep 3
              echo "Tarefa concluida com sucesso"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
