# Runs one Pod per node to demonstrate the DaemonSet behavior.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: node-observer
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: daemonset
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-observer
        app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
        app.kubernetes.io/component: daemonset
        environment: lab
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: observer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date) pod=${POD_NAME} node=${NODE_NAME} message='DaemonSet node-observer em execucao neste Node'"
                sleep 30
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
