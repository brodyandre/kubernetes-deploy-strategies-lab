# Headless Service that exposes individual StatefulSet Pod endpoints through DNS.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: deploy-strategies-lab
  labels:
    app.kubernetes.io/name: web-headless
    app.kubernetes.io/part-of: kubernetes-deploy-strategies-lab
    app.kubernetes.io/component: headless-service
    app.kubernetes.io/managed-by: kubectl
    environment: lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: web-headless
  ports:
    - name: http
      port: 80
      targetPort: 8080
